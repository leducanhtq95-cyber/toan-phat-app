<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Toàn Phát</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #101b2f;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        width: 100%;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 14px;
        background: #101B2F;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.04em;
      }
      h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
      p { font-size: 14px; line-height: 1.5; color: #94a3b8; margin-bottom: 20px; }
      button {
        width: 100%;
        padding: 12px 16px;
        border: none;
        border-radius: 10px;
        background: #1d4ed8;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">TP</div>
      <h1>Toàn Phát</h1>
      <p>Không thể kết nối tới máy chủ phần mềm. Vui lòng kiểm tra Wi-Fi hoặc 4G rồi thử lại.</p>
      <button onclick="window.location.href='https://toanphat.ap.vn'">
        Thử kết nối lại
      </button>
    </div>
  </body>
</html>
